<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img">
<title>Boucle et trace manuelle</title><desc>Une boucle additionne 12, puis 15, puis 9 ; le total devient 12, 27, puis 36.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195980"/></marker></defs>
<rect width="880" height="350" fill="#ffffff"/>
<text x="32" y="42" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#17324b">Boucle et trace manuelle</text>
<path d="M 240 178 L 310 178" fill="none" stroke="#195980" stroke-width="3" marker-end="url(#p)"/>
<path d="M 545 178 L 615 178" fill="none" stroke="#195980" stroke-width="3" marker-end="url(#p)"/>
<rect x="45" y="125" width="190" height="105" rx="12" fill="#eaf3f7" stroke="#195980" stroke-width="2"/>
<text x="140" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">Départ</text>
<text x="140" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">total = 0</text>
<rect x="315" y="125" width="225" height="105" rx="12" fill="#eaf3f7" stroke="#195980" stroke-width="2"/>
<text x="427" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">Tour 1 : +12</text>
<text x="427" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">total = 12</text>
<rect x="620" y="125" width="215" height="105" rx="12" fill="#eaf3f7" stroke="#195980" stroke-width="2"/>
<text x="727" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">Tour 2 : +15</text>
<text x="727" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">total = 27</text>
<text x="32" y="325" font-family="Arial,sans-serif" font-size="16" fill="#17324b">Tour 3 : +9 → total = 36 ; puis la boucle s’arrête.</text></svg>
