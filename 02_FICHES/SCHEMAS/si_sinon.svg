<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img">
<title>Choisir avec SI / SINON</title><desc>Si total est au moins vingt on affiche remise possible, sinon prix normal.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195980"/></marker></defs>
<rect width="880" height="350" fill="#ffffff"/>
<text x="32" y="42" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#17324b">Choisir avec SI / SINON</text>
<path d="M 325 155 L 515 132" fill="none" stroke="#195980" stroke-width="3" marker-end="url(#p)"/>
<text x="420" y="131" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17324b">oui</text>
<path d="M 325 192 L 515 250" fill="none" stroke="#195980" stroke-width="3" marker-end="url(#p)"/>
<text x="420" y="209" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17324b">non</text>
<rect x="55" y="130" width="265" height="90" rx="12" fill="#eaf3f7" stroke="#195980" stroke-width="2"/>
<text x="187" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">total ≥ 20 ?</text>
<rect x="520" y="95" width="295" height="75" rx="12" fill="#eaf3f7" stroke="#195980" stroke-width="2"/>
<text x="667" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">VRAI</text>
<text x="667" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">Remise possible</text>
<rect x="520" y="215" width="295" height="75" rx="12" fill="#eaf3f7" stroke="#195980" stroke-width="2"/>
<text x="667" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">FAUX</text>
<text x="667" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">Prix normal</text>
<text x="32" y="325" font-family="Arial,sans-serif" font-size="16" fill="#17324b">Un seul des deux chemins est suivi pour une valeur donnée.</text></svg>
