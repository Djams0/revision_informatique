<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img">
<title>Affecter une variable</title><desc>La variable total reçoit zéro puis reçoit la somme de sa valeur précédente et du prix.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195980"/></marker></defs>
<rect width="880" height="350" fill="#ffffff"/>
<text x="32" y="42" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#17324b">Affecter une variable</text>
<path d="M 360 180 L 520 180" fill="none" stroke="#195980" stroke-width="3" marker-end="url(#p)"/>
<text x="440" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17324b">ancienne valeur + 5</text>
<rect x="80" y="130" width="275" height="100" rx="12" fill="#eaf3f7" stroke="#195980" stroke-width="2"/>
<text x="217" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">total ← 0</text>
<text x="217" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">valeur : 0</text>
<rect x="525" y="130" width="275" height="100" rx="12" fill="#eaf3f7" stroke="#195980" stroke-width="2"/>
<text x="662" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">total ← total + 5</text>
<text x="662" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">valeur : 5</text>
<text x="32" y="325" font-family="Arial,sans-serif" font-size="16" fill="#17324b">← signifie « reçoit » ; le second total est remplacé par 5.</text></svg>
