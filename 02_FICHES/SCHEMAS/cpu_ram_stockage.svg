<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img">
<title>CPU, RAM et stockage</title><desc>Le processeur exécute, la RAM garde le travail temporaire et le stockage conserve un fichier enregistré.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195980"/></marker></defs>
<rect width="880" height="350" fill="#ffffff"/>
<text x="32" y="42" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#17324b">CPU, RAM et stockage</text>
<path d="M 260 175 L 345 175" fill="none" stroke="#195980" stroke-width="3" marker-end="url(#p)"/>
<text x="302" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17324b">travail</text>
<path d="M 535 175 L 660 175" fill="none" stroke="#195980" stroke-width="3" marker-end="url(#p)"/>
<text x="597" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#17324b">enregistrer</text>
<rect x="45" y="120" width="215" height="110" rx="12" fill="#eaf3f7" stroke="#195980" stroke-width="2"/>
<text x="152" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">CPU</text>
<text x="152" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">exécute</text>
<rect x="350" y="120" width="180" height="110" rx="12" fill="#eaf3f7" stroke="#195980" stroke-width="2"/>
<text x="440" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">RAM</text>
<text x="440" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">temporaire</text>
<rect x="665" y="120" width="170" height="110" rx="12" fill="#eaf3f7" stroke="#195980" stroke-width="2"/>
<text x="750" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">SSD</text>
<text x="750" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324b">conserve</text>
<text x="32" y="325" font-family="Arial,sans-serif" font-size="16" fill="#17324b">Après redémarrage, on retrouve le fichier enregistré sur le SSD.</text></svg>
